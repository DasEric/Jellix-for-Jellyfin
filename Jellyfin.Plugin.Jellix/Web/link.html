<div id="JellixLinkPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
  <div data-role="content">
    <div class="content-primary">
      <h2 id="jellixLinkHeading">Discord verbinden</h2>
      <p id="jellixLinkDescription">Erzeuge einen einmaligen Code und gib ihn anschließend in Discord mit <code>/verbinden</code> (Deutsch) oder <code>/link</code> (English) ein.</p>
      <button is="emby-button" type="button" class="raised button-submit block" id="jellixCreateCode"><span>Code erzeugen</span></button>
      <button is="emby-button" type="button" class="raised block" id="jellixUnlink" style="display:none"><span>Discord-Verknüpfung aufheben</span></button>
      <div id="jellixCodeResult" style="margin-top:1.5em"></div>
    </div>
  </div>
  <script src="configurationpage?name=JellixLinkJS"></script>
</div>
