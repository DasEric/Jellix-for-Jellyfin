<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jellix – Passwort ändern</title>
  <style>
    :root{color-scheme:dark;background:#101114;color:#f5f5f5;font:16px system-ui,sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1rem;box-sizing:border-box}
    main{width:min(28rem,100%);background:#1b1d22;border:1px solid #30333b;border-radius:12px;padding:1.5rem;box-sizing:border-box}
    h1{font-size:1.35rem;margin:0 0 .5rem}p{line-height:1.45;color:#c9cbd1}
    label{display:block;margin:1rem 0 .35rem}input,button{width:100%;box-sizing:border-box;border-radius:7px;font:inherit}
    input{padding:.75rem;border:1px solid #555b68;background:#111318;color:#fff}
    button{margin-top:1.25rem;padding:.8rem;border:0;background:#00a4dc;color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.message{min-height:1.5rem;margin-top:1rem}.error{color:#ff8c8c}.success{color:#78df9a}
  </style>
</head>
<body>
  <main>
    <h1 id="pageTitle">Jellyfin-Passwort ändern</h1>
    <p id="pageInfo">Dieser Link ist nur einmal und für kurze Zeit gültig.</p>
    <form id="passwordForm" autocomplete="off">
      <label id="newPasswordLabel" for="newPassword">Neues Passwort</label>
      <input id="newPassword" type="password" maxlength="256" autocomplete="new-password" required>
      <label id="confirmPasswordLabel" for="confirmPassword">Passwort wiederholen</label>
      <input id="confirmPassword" type="password" maxlength="256" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Passwort ändern</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>
  <script src="PasswordScript"></script>
</body>
</html>
